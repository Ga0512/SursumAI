name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the installer promises; 3.12 is what uv creates
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

  # The three macOS bugs of v1.0.21-23 (GNU-only `find -printf`, uv installed
  # and then declared missing, a launcher written through an old symlink) all
  # shipped because nothing here had ever run on a Mac. This job installs the
  # real thing on one.
  macos-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install from this checkout
        env:
          SURSUMAI_SRC_DIR: ${{ github.workspace }}
          SURSUMAI_DIR: ${{ runner.temp }}/sursumai
          SURSUMAI_NO_START: "1"
        run: bash install.sh

      - name: The command has to actually run
        run: |
          # this is what the three bugs broke, each in its own way
          "$HOME/.local/bin/sursumai" version
          "$HOME/.local/bin/sursumai" status || true

      - name: The CLI script must still be Python
        run: head -1 "${{ runner.temp }}/sursumai/sursumai/bin/sursumai" | grep -q python3

  macos-pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse the shell scripts
        run: |
          for script in install.sh setup.sh start.sh release.sh; do
            bash -n "$script"
          done

      - name: Lint the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error install.sh setup.sh start.sh release.sh

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Parse the front-end
        run: node --check web/app.js
